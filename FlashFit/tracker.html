<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashFit - Jangan Mager!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #06030d;
            color: #cbd5e1;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 40%);
        }
        .font-tech { font-family: 'Rajdhani', sans-serif; }
        .glass-card {
            background: linear-gradient(135deg, rgba(20, 13, 36, 0.7) 0%, rgba(12, 7, 22, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-card:hover { border-color: rgba(139, 92, 246, 0.35); }
        .glass-input {
            background: rgba(18, 10, 32, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.25);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-input:focus { border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
        .btn-neon {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
            transition: all 0.25s ease;
        }
        .btn-neon:hover { box-shadow: 0 0 28px rgba(139, 92, 246, 0.6); transform: translateY(-1px); }
        .nav-item { transition: all 0.2s ease; border: 1px solid transparent; }
        .nav-item.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.25) 0%, rgba(139, 92, 246, 0.05) 100%);
            border-left-color: #a855f7;
            color: #ffffff;
            font-weight: 600;
        }
        .nav-item:hover:not(.active) { background: rgba(255, 255, 255, 0.03); color: #f1f5f9; }
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%3aa855f7' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.2em 1.2em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            appearance: none;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #06030d; }
        ::-webkit-scrollbar-thumb { background: #271542; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- SIDEBAR NAVIGASI -->
    <aside class="w-full md:w-64 bg-[#090514]/90 backdrop-blur-xl border-r border-purple-900/20 p-5 flex flex-col justify-between shrink-0 min-h-screen">
        <div class="space-y-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-950/60 border border-purple-500/40 flex items-center justify-center text-purple-400 text-xl font-bold shadow-[0_0_15px_rgba(168,85,247,0.3)]">
                        ⚡
                    </div>
                    <div>
                        <h1 class="text-2xl font-extrabold text-white tracking-wider font-tech">Flash<span class="text-purple-400">Fit</span></h1>
                        <p class="text-[9px] text-purple-300/60 font-tech tracking-widest uppercase">Activity Tracker</p>
                    </div>
                </div>
                <button class="md:hidden text-slate-400 hover:text-white" onclick="toggleMobileMenu()">☰</button>
            </div>

            <!-- MENU NAVIGASI -->
            <nav id="nav-menu" class="space-y-2 hidden md:block">
                <a href="index.html" class="nav-item text-slate-400 flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-slate-500">📊</span> Dashboard Utama
                </a>
                <a href="tracker.html" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-purple-400">📝</span> Activity Log Tracker
                </a>
                <a href="bmi.html" class="nav-item text-slate-400 flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-slate-500">🧮</span> BMI & BMR Calculator
                </a>
                <a href="analytics.html" class="nav-item text-slate-400 flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-slate-500">📈</span> Analytics Page
                </a>
                <a href="achievements.html" class="nav-item text-slate-400 flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-slate-500">🏆</span> Achievements
                </a>
            </nav>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-5 md:p-8 space-y-6 overflow-y-auto">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
            <div>
                <h1 class="text-3xl font-extrabold text-white font-tech tracking-wide">Activity Log Tracker</h1>
                <p class="text-xs text-purple-400/80">Kalkulasi kalori terhitung otomatis berdasarkan durasi latihan</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- FORM INPUT AKTIVITAS -->
            <div class="lg:col-span-5 space-y-4">
                <div class="glass-card rounded-2xl p-5 space-y-4">
                    <h2 class="text-xs font-extrabold uppercase font-tech tracking-widest text-slate-300 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-purple-500"></span> Tambah Sesi Olahraga
                    </h2>

                    <form id="activity-form" onsubmit="saveActivity(event)" class="space-y-4">
                        <div>
                            <label class="block text-[11px] font-tech font-bold uppercase tracking-wider text-slate-400 mb-1.5">Jenis Aktivitas</label>
                            <select id="act-type" onchange="calculateCalories()" required class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-white font-medium focus:outline-none">
                                <option value="Lari / Jogging">Lari / Jogging (~9.3 kcal/mnt)</option>
                                <option value="Jalan Kaki">Jalan Kaki (~4.0 kcal/mnt)</option>
                                <option value="Gym / Beban">Gym / Beban (~5.8 kcal/mnt)</option>
                                <option value="Bersepeda">Bersepeda (~8.7 kcal/mnt)</option>
                                <option value="Berenang">Berenang (~9.3 kcal/mnt)</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-tech font-bold uppercase tracking-wider text-slate-400 mb-1.5">Durasi (Menit)</label>
                                <input type="number" id="act-duration" oninput="calculateCalories()" placeholder="30" min="1" required class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-tech font-bold uppercase tracking-wider text-purple-400 mb-1.5">Kalori (Otomatis)</label>
                                <input type="number" id="act-calories" readonly placeholder="0" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-purple-300 font-bold bg-purple-950/40 border-purple-500/40 focus:outline-none cursor-not-allowed">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-tech font-bold uppercase tracking-wider text-slate-400 mb-1.5">Tanggal & Waktu</label>
                            <input type="date" id="act-date" required class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
                        </div>

                        <button type="submit" class="w-full btn-neon text-white font-tech font-extrabold tracking-wider text-sm py-3 rounded-xl flex items-center justify-center gap-2 active:scale-[0.98]">
                            SIMPAN AKTIVITAS 
                        </button>
                    </form>
                </div>
            </div>

            <!-- TABEL RIWAYAT LOG HARIAN -->
            <div class="lg:col-span-7 space-y-4">
                <div class="glass-card rounded-2xl p-5 space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xs font-extrabold uppercase font-tech tracking-widest text-slate-300 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-cyan-400"></span> Log Aktivitas Hari Ini
                        </h2>
                        <button onclick="clearAllLogs()" class="text-[10px] font-tech text-rose-400 hover:text-rose-300 transition-colors uppercase">
                            🗑️ Bersihkan Tampilan
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-purple-900/40 text-[10px] font-tech uppercase text-slate-400">
                                    <th class="p-3">Aktivitas</th>
                                    <th class="p-3">Durasi</th>
                                    <th class="p-3">Kalori</th>
                                    <th class="p-3">Tanggal</th>
                                    <th class="p-3 text-center">Hapus</th>
                                </tr>
                            </thead>
                            <tbody id="log-table-body" class="text-xs divide-y divide-purple-900/20">
                                <!-- Data dimasukkan lewat JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        document.getElementById('act-date').valueAsDate = new Date();

        // 1. Nilai MET untuk kalkulasi Kalori Otomatis (Asumsi Berat Badan Rata-Rata = 70 kg)
        const MET_VALUES = {
            'Lari / Jogging': 8.0,
            'Jalan Kaki': 3.5,
            'Gym / Beban': 5.0,
            'Bersepeda': 7.5,
            'Berenang': 8.0
        };

        // 2. Fungsi Hitung Kalori Otomatis
        function calculateCalories() {
            const type = document.getElementById('act-type').value;
            const duration = parseFloat(document.getElementById('act-duration').value) || 0;
            const met = MET_VALUES[type] || 5.0;

            // Rumus: MET * 70kg * (Durasi / 60 jam)
            const estimatedCalories = Math.round(met * 70 * (duration / 60));
            document.getElementById('act-calories').value = estimatedCalories > 0 ? estimatedCalories : '';
        }

        function checkAndResetDailyTracker() {
            const today = new Date().toISOString().split('T')[0];
            const lastActiveDate = localStorage.getItem('fitTrackLastDate');

            if (lastActiveDate && lastActiveDate !== today) {
                localStorage.setItem('fitTrackActivities', JSON.stringify([]));
            }
            localStorage.setItem('fitTrackLastDate', today);
        }

        function getDailyLogs() {
            return JSON.parse(localStorage.getItem('fitTrackActivities')) || [];
        }

        function getAllHistoryLogs() {
            return JSON.parse(localStorage.getItem('fitTrackHistory')) || [];
        }

        function saveActivity(e) {
            e.preventDefault();

            const type = document.getElementById('act-type').value;
            const duration = parseInt(document.getElementById('act-duration').value);
            const calories = parseInt(document.getElementById('act-calories').value) || 0;
            const date = document.getElementById('act-date').value;

            const newLog = { id: Date.now(), type, duration, calories, date };

            const dailyLogs = getDailyLogs();
            dailyLogs.unshift(newLog);
            localStorage.setItem('fitTrackActivities', JSON.stringify(dailyLogs));

            const historyLogs = getAllHistoryLogs();
            historyLogs.unshift(newLog);
            localStorage.setItem('fitTrackHistory', JSON.stringify(historyLogs));

            document.getElementById('act-duration').value = '';
            document.getElementById('act-calories').value = '';
            renderTable();
        }

        function renderTable() {
            const logs = getDailyLogs();
            const tbody = document.getElementById('log-table-body');
            tbody.innerHTML = '';

            if (logs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-4 text-center text-slate-500 font-tech text-xs">
                            Belum ada aktivitas hari ini. Masukkan durasi latihamu! ⚡
                        </td>
                    </tr>
                `;
                return;
            }

            logs.forEach(log => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-purple-950/20 transition-colors";
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-white">${log.type}</td>
                    <td class="p-3 text-cyan-400 font-tech">${log.duration} Mnt</td>
                    <td class="p-3 text-purple-400 font-tech">${log.calories} kcal</td>
                    <td class="p-3 text-slate-400 text-[11px]">${log.date}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteLog(${log.id})" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1 rounded hover:bg-rose-950/50 transition-colors">
                            ✕
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteLog(id) {
            let dailyLogs = getDailyLogs().filter(log => log.id !== id);
            let historyLogs = getAllHistoryLogs().filter(log => log.id !== id);

            localStorage.setItem('fitTrackActivities', JSON.stringify(dailyLogs));
            localStorage.setItem('fitTrackHistory', JSON.stringify(historyLogs));
            renderTable();
        }

        function clearAllLogs() {
            if (confirm("Kosongkan tampilan tracker hari ini? (Statistik mingguan/bulanan tetap tersimpan)")) {
                localStorage.setItem('fitTrackActivities', JSON.stringify([]));
                renderTable();
            }
        }

        function toggleMobileMenu() {
            document.getElementById('nav-menu').classList.toggle('hidden');
        }

        checkAndResetDailyTracker();
        renderTable();
    </script>
</body>
</html>
