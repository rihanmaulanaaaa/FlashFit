<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashFit - Jangan Mager!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #06030d;
            color: #cbd5e1;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 40%);
        }
        .font-tech { font-family: 'Rajdhani', sans-serif; }
        .glass-card {
            background: linear-gradient(135deg, rgba(20, 13, 36, 0.7) 0%, rgba(12, 7, 22, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.18);
        }
        .glass-input {
            background: rgba(18, 10, 32, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.25);
        }
        .btn-neon {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
        }
        .nav-item { transition: all 0.2s ease; border: 1px solid transparent; }
        .nav-item.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.25) 0%, rgba(139, 92, 246, 0.05) 100%);
            border-left-color: #a855f7;
            color: #ffffff;
            font-weight: 600;
        }
        .nav-item:hover:not(.active) { background: rgba(255, 255, 255, 0.03); color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <aside class="w-full md:w-64 bg-[#090514]/90 backdrop-blur-xl border-r border-purple-900/20 p-5 flex flex-col justify-between shrink-0 min-h-screen">
        <div class="space-y-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-950/60 border border-purple-500/40 flex items-center justify-center text-purple-400 text-xl font-bold shadow-[0_0_15px_rgba(168,85,247,0.3)]">
                        ⚡
                    </div>
                    <div>
                        <h1 class="text-2xl font-extrabold text-white tracking-wider font-tech">Flash<span class="text-purple-400">Fit</span></h1>
                        <p class="text-[9px] text-purple-300/60 font-tech tracking-widest uppercase">Activity Tracker</p>
                    </div>
                </div>
                <button class="md:hidden text-slate-400" onclick="toggleMobileMenu()">☰</button>
            </div>

            <!-- MENU NAVIGASI TERHUBUNG -->
            <nav id="nav-menu" class="space-y-2 hidden md:block">
                <a href="index.html" class="nav-item text-slate-400 flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-slate-500">📊</span> Dashboard Utama
                </a>
                <a href="tracker.html" class="nav-item text-slate-400 flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-slate-500">📝</span> Activity Log Tracker
                </a>
                <a href="walking.html" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-purple-400">🚶</span> Walking Schedule
                </a>
                <a href="bmi.html" class="nav-item text-slate-400 flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-slate-500">🧮</span> BMI & BMR Calculator
                </a>
                <a href="analytics.html" class="nav-item text-slate-400 flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-slate-500">📈</span> Analytics Page
                </a>
                <a href="achievements.html" class="nav-item text-slate-400 flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-tech tracking-wider uppercase">
                    <span class="text-slate-500">🏆</span> Achievements
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 p-5 md:p-8 space-y-6 overflow-y-auto">
        <div>
            <h1 class="text-3xl font-extrabold text-white font-tech">Walking Schedule</h1>
            <p class="text-xs text-purple-400/80">Atur jadwal & target jalan kaki harianmu</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 space-y-4">
                <div class="glass-card rounded-2xl p-5 space-y-4">
                    <h2 class="text-xs font-extrabold uppercase font-tech text-slate-300">Tambah Sesi Jalan Kaki</h2>
                    <form onsubmit="addSchedule(event)" class="space-y-3">
                        <input type="text" id="sched-title" placeholder="Nama Sesi / Lokasi" required class="w-full glass-input rounded-xl px-3.5 py-2 text-xs text-white">
                        <input type="text" id="sched-day" placeholder="Hari (Misal: Rabu, 12 Ags)" required class="w-full glass-input rounded-xl px-3.5 py-2 text-xs text-white">
                        <input type="number" id="sched-target" placeholder="Target Langkah" required class="w-full glass-input rounded-xl px-3.5 py-2 text-xs text-white">
                        <button type="submit" class="w-full btn-neon text-white font-tech font-bold text-xs py-2.5 rounded-xl">SIMPAN JADWAL</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-7 space-y-3" id="schedule-list"></div>
        </div>
    </main>

    <script>
        let schedules = [
            { id: 1, title: 'Jalan Pagi Komplek', day: 'Rabu, 12 Ags', target: 3500 }
        ];

        function renderSchedules() {
            const container = document.getElementById('schedule-list');
            container.innerHTML = '';
            schedules.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-4 flex items-center justify-between border-l-4 border-l-purple-500";
                card.innerHTML = `
                    <div>
                        <h3 class="text-sm font-bold text-white font-tech">${item.title}</h3>
                        <p class="text-xs text-slate-400 font-tech">📅 ${item.day} | 🎯 ${item.target} steps</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addSchedule(e) {
            e.preventDefault();
            const title = document.getElementById('sched-title').value;
            const day = document.getElementById('sched-day').value;
            const target = document.getElementById('sched-target').value;
            schedules.push({ id: Date.now(), title, day, target });
            renderSchedules();
        }

        function toggleMobileMenu() { document.getElementById('nav-menu').classList.toggle('hidden'); }
        renderSchedules();
    </script>
</body>
</html>
